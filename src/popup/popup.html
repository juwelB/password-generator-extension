<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Generator</title>
  </head>
  <body>
    <main>
      <output id="password"></output>

      <div>
        <button id="regenerate" type="button">Regenerate</button>
        <button id="copy" type="button">Copy</button>
      </div>

      <p id="entropy"></p>

      <label for="length">Length: <span id="length-value"></span></label>
      <input id="length" type="range" />

      <fieldset>
        <legend>Characters</legend>
        <label><input type="checkbox" data-set="upperCase" /> Uppercase</label>
        <label><input type="checkbox" data-set="lowerCase" /> Lowercase</label>
        <label><input type="checkbox" data-set="digits" /> Digits</label>
        <label><input type="checkbox" data-set="symbols" /> Symbols</label>
      </fieldset>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
