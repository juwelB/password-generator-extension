<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <output id="password" class="password"></output>
      <p id="entropy" class="strength"></p>

      <div class="actions">
        <button id="copy" type="button" class="primary">Copy</button>
        <button id="regenerate" type="button">Regenerate</button>
      </div>

      <div class="length">
        <label for="length">Length <span id="length-value"></span></label>
        <input id="length" type="range" />
      </div>

      <fieldset class="sets">
        <legend class="visually-hidden">Characters to include</legend>
        <label
          ><input type="checkbox" data-set="upperCase" aria-label="Uppercase letters" />A–Z</label
        >
        <label
          ><input type="checkbox" data-set="lowerCase" aria-label="Lowercase letters" />a–z</label
        >
        <label class="digit"
          ><input type="checkbox" data-set="digits" aria-label="Digits" />0–9</label
        >
        <label class="symbol"
          ><input type="checkbox" data-set="symbols" aria-label="Symbols" />!@#</label
        >
      </fieldset>
    </main>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
